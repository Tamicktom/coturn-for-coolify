services:
  coturn:
    image: coturn/coturn
    restart: always
    network_mode: host
    volumes:
      - coturn-data:/var/lib/coturn
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=49252
      - --realm=${REALM:-turn.example.com}
      - --user=${TURN_USER:-user}:${TURN_PASSWORD:-password}
      - --lt-cred-mech
      - --fingerprint
      - --external-ip=${EXTERNAL_IP:-}

volumes:
  coturn-data:
